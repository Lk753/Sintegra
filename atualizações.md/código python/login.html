<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento IoT</title>
    <style>
        /* Cores globais - Tema Azul Escuro */
        :root {
            --bg-principal: #0f172a; /* Azul escuro profundo */
            --bg-card: #1e293b;      /* Azul escuro para os cards */
            --azul-accent: #3b82f6;  /* Azul brilhante para botões */
            --azul-hover: #2563eb;
            --texto-claro: #f8fafc;
            --texto-mutado: #94a3b8;
            
            /* Cores de Status */
            --temp-baixa: #38bdf8;   /* Azul claro */
            --temp-normal: #4ade80;  /* Verde */
            --temp-elevada: #ef4444; /* Vermelho */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: max-width 0.5s ease;
        }

        .container.dashboard-wide {
            max-width: 850px;
        }

        /* Abas de Navegação (Login/Cadastro) */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #334155;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--texto-mutado);
            padding: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .tab-btn.active {
            color: var(--azul-accent);
            border-bottom: 2px solid var(--azul-accent);
            margin-bottom: -2px;
        }

        /* Formulários */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        h2 {
            margin-bottom: 10px;
            text-align: center;
            font-size: 24px;
        }

        .txt-hora-medicao {
            text-align: center;
            font-size: 14px;
            color: var(--texto-mutado);
            margin-bottom: 25px;
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--texto-mutado);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: var(--texto-claro);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--azul-accent);
        }

        button.btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--azul-accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.btn-submit:hover {
            background-color: var(--azul-hover);
        }

        /* Estilos do Dashboard */
        .grid-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card-sensor {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }

        .card-sensor h3 {
            font-size: 14px;
            color: var(--texto-mutado);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .valor-sensor {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-baixa { background-color: rgba(56, 189, 248, 0.2); color: var(--temp-baixa); }
        .status-normal { background-color: rgba(74, 222, 128, 0.2); color: var(--temp-normal); }
        .status-elevada { background-color: rgba(239, 68, 68, 0.2); color: var(--temp-elevada); }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="authTabs" class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('cadastro')">Cadastro</button>
        </div>

        <div id="loginSection" class="form-section active">
            <h2>Acessar Painel</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>

        <div id="cadastroSection" class="form-section">
            <h2>Criar Conta</h2>
            <form onsubmit="handleCadastro(event)">
                <div class="input-group">
                    <label for="cad-nome">Nome Completo</label>
                    <input type="text" id="cad-nome" required placeholder="João Silva">
                </div>
                <div class="input-group">
                    <label for="cad-email">E-mail</label>
                    <input type="email" id="cad-email" required placeholder="seu@email.com">
                </div>
                <div class="input-group">
                    <label for="cad-senha">Senha</label>
                    <input type="password" id="cad-senha" required placeholder="Mínimo 6 caracteres">
                </div>
                <button type="submit" class="btn-submit">Registrar Usuário</button>
            </form>
        </div>

        <div id="dashboardSection" class="form-section">
            <h2 id="boas-vindas">Painel de Monitoramento Telemetria</h2>
            <span class="txt-hora-medicao" id="hora-atualizacao">Última medição: --:--:--</span>
            
            <div class="grid-dashboard">
                <div class="card-sensor">
                    <h3>Rotação (Potenciômetro)</h3>
                    <div class="valor-sensor" id="val-rotacao">0 RPM</div>
                    <span class="status-badge status-normal">Ativo</span>
                </div>

                <div class="card-sensor">
                    <h3>Temperatura (DHT11)</h3>
                    <div class="valor-sensor" id="val-temp">--°C</div>
                    <span class="status-badge" id="status-temp">--</span>
                </div>

                <div class="card-sensor">
                    <h3>Umidade (DHT11)</h3>
                    <div class="valor-sensor" id="val-umidade">--%</div>
                    <span class="status-badge status-normal" style="color: #60a5fa; background: rgba(96, 165, 250, 0.2);">Estável</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let intervaloLectura = null;

        function switchTab(tipo) {
            const tabs = document.querySelectorAll('.tab-btn');
            const sections = document.querySelectorAll('.form-section');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            sections.forEach(sec => sec.classList.remove('active'));

            if (tipo === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('cadastroSection').classList.add('active');
            }
        }

        async function handleCadastro(e) {
            e.preventDefault();
            const nome = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;

            try {
                const resposta = await fetch('/api/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });
                const resultado = await resposta.json();

                if (resposta.ok) {
                    alert(resultado.mensagem);
                    switchTab('login');
                } else {
                    alert("Erro: " + resultado.erro);
                }
            } catch (erro) {
                alert("Não foi possível conectar ao servidor.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;

            try {
                const resposta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const resultado = await resposta.json();

                if (resposta.ok) {
                    document.getElementById('authTabs').style.display = 'none';
                    document.getElementById('loginSection').classList.remove('active');
                    document.getElementById('mainContainer').classList.add('dashboard-wide');
                    document.getElementById('dashboardSection').classList.add('active');
                    document.getElementById('boas-vindas').innerText = `Olá, ${resultado.usuario}! Painel de Telemetria`;
                    
                    atualizarDashboard();
                    intervaloLectura = setInterval(atualizarDashboard, 2000);
                } else {
                    alert("Erro: " + resultado.erro);
                }
            } catch (erro) {
                alert("Não foi possível conectar ao servidor.");
            }
        }

        // Busca dados atuais do banco de dados através da API do Flask
        async function atualizarDashboard() {
            try {
                const resAtual = await fetch('/api/telemetria/atual');
                const dados = await resAtual.json();

                // Atualiza os valores nos cards
                document.getElementById('val-rotacao').innerText = `${dados.rpm} RPM`;
                document.getElementById('val-temp').innerText = `${dados.temperatura}°C`;
                document.getElementById('val-umidade').innerText = `${dados.umidade}%`;

                /* Mapeia o horário vindo diretamente do seu Banco de Dados (MySQL).
                  Caso seu backend use outro nome de propriedade (ex: dados.horario ou dados.hora),
                  basta alterar o 'data_hora' abaixo para corresponder à chave do JSON do Python.
                */
                if (dados.data_hora) {
                    document.getElementById('hora-atualizacao').innerText = `Última medição: ${dados.data_hora}`;
                } else {
                    // Fallback caso o banco não envie a propriedade formatada
                    const agora = new Date();
                    document.getElementById('hora-atualizacao').innerText = `Última atualização: ${agora.toLocaleTimeString('pt-BR')}`;
                }

                // Regras visuais dinâmicas para a tag de Temperatura
                const badgeTemp = document.getElementById('status-temp');
                badgeTemp.className = "status-badge";
                
                let temp = parseFloat(dados.temperatura);
                if (temp >= 15 && temp < 20) {
                    badgeTemp.innerText = "Temperatura Baixa";
                    badgeTemp.classList.add('status-baixa');
                } else if (temp >= 20 && temp <= 28) {
                    badgeTemp.innerText = "Normal";
                    badgeTemp.classList.add('status-normal');
                } else if (temp > 28) {
                    badgeTemp.innerText = "Temperatura Elevada";
                    badgeTemp.classList.add('status-elevada');
                } else if (temp > 0 && temp < 15) {
                    badgeTemp.innerText = "Crítica / Muito Baixa";
                    badgeTemp.classList.add('status-baixa');
                }

            } catch (e) {
                console.error("Erro ao atualizar o dashboard:", e);
            }
        }
    </script>
</body>
</html>
